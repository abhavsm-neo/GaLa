<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaLa Launcher Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090B0F;--s0:#0F1218;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.08);--s3:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --t1:#F3F5F8;--t2:#AFB6C3;--t3:#747C8B;
  --go:#6CBF2E;--go-h:#83D443;--go-t:#10260A;--warn:#FFB547;--bad:#FF6B6B;--info:#5AB6FF;
  --amb:#5AB6FF;--card:178px;--bar:52px;
  --disp:"Rajdhani","Segoe UI Semibold",sans-serif;--ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t1);font:500 13.5px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:9px;border:3px solid transparent;background-clip:content-box}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.2px}

#ambient{position:fixed;inset:-80px;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5);opacity:.2;transition:background-image .6s;pointer-events:none}
#ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg) 75%)}
.shell{position:relative;height:100vh;display:flex;flex-direction:column}

.titlebar{height:var(--bar);flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;background:rgba(9,11,15,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:10}
.brand{display:flex;align-items:center;margin-right:14px;color:var(--t1)}
.brand svg{width:26px;height:26px;display:block}
.hist{width:30px;height:30px;border-radius:7px;color:var(--t2);font-size:16px}.hist:hover{background:var(--s2);color:var(--t1)}
.nav{height:var(--bar);padding:0 13px;color:var(--t2);font:600 18px var(--disp);letter-spacing:.5px;position:relative}
.nav:hover{color:var(--t1)}.nav.on{color:var(--t1)}.nav.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--amb)}
.searchbtn{flex:1;max-width:340px;margin-left:auto;height:34px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--s1);border:1px solid var(--line);border-radius:9px;color:var(--t3)}
.searchbtn:hover{background:var(--s2)}.searchbtn kbd{margin-left:auto}
kbd{font:600 11px var(--ui);background:var(--s2);padding:1px 6px;border-radius:5px;color:var(--t2)}
.dlpill{display:flex;align-items:center;gap:9px;height:34px;padding:0 11px 0 5px;border-radius:9px;background:var(--s1);border:1px solid var(--line);min-width:172px}
.dlpill:hover{background:var(--s2)}
.ring{--p:0;width:25px;height:25px;border-radius:50%;background:conic-gradient(var(--go) calc(var(--p)*1%),var(--s3) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:17px;height:17px;background:var(--s0);border-radius:50%}
.dlpill small{display:block;font-size:11px;line-height:1.15;color:var(--t2);text-align:left;white-space:nowrap}.dlpill b{display:block;font-size:12px;line-height:1.2;text-align:left;font-weight:700}
.iconbtn{height:34px;min-width:34px;padding:0 9px;border-radius:9px;background:var(--s1);border:1px solid var(--line);color:var(--t2);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.iconbtn:hover{background:var(--s2);color:var(--t1)}.iconbtn.on{color:var(--go);border-color:rgba(108,191,46,.45)}
.searchbtn,.dlpill,.iconbtn,.select,.seg,.seg button,.chip{border-radius:3px}
.iconbtn,.seg button,.chip,.subt button,.shelfhead button,.sideitem,.pb-up b{font-family:var(--disp);font-weight:700;font-size:15px}

#view{flex:1;min-height:0;overflow:auto;position:relative;animation:fade .25s ease}
#view.flat{overflow:hidden}
@keyframes fade{from{opacity:0;transform:translateY(5px)}}
.footer{height:30px;flex:none;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:12px;color:var(--t2);background:rgba(9,11,15,.82);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden}
.footer .ok{color:var(--go)}.footer .end{margin-left:auto}
.nowplaying{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--s0);border-top:1px solid var(--line2)}
.nowplaying img{height:42px;border-radius:5px}.nowplaying b{font:600 19px var(--disp);display:block;line-height:1.1}.nowplaying small{color:var(--t2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--go);animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.25}}

.btn{height:38px;padding:0 16px;border-radius:3px;background:transparent;border:1px solid var(--line2);font:700 16px var(--disp);display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{background:var(--s2);border-color:var(--t3)}.btn.sm{height:30px;padding:0 12px;font-size:14.5px}
.play{background:#4FA321;border-color:#4FA321;color:#fff}.play:hover{background:#5DB82E;border-color:#5DB82E}
.playbox{display:inline-flex;height:64px;border-radius:3px;overflow:hidden;background:linear-gradient(180deg,#7CC332,#3F8F1A);color:#fff;flex:none}
.playbox button{display:flex;align-items:center;justify-content:center;height:100%;color:#fff}.playbox button:hover{background:rgba(255,255,255,.15)}
.pb-play{width:64px}.pb-play svg{width:27px;height:31px}
.pb-up{gap:10px;padding:0 18px 0 15px;border-left:1px solid rgba(255,255,255,.32);text-align:left}.pb-up svg{width:20px;height:22px;flex:none}
.pb-up b{display:block;font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;line-height:1.2}.pb-up small{display:block;font-size:11.5px;color:#E7F4D8;line-height:1.2;white-space:nowrap}
.timeplayed{display:flex;flex-direction:column;color:var(--t2);font-size:13px;line-height:1.35}.timeplayed small{color:var(--t1);font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.btn[data-play]::before{content:"";border-left:9px solid currentColor;border-block:6px solid transparent}
.play.stop{background:transparent;border-color:var(--bad);color:var(--bad)}.play.stop:hover{background:rgba(255,107,107,.12);border-color:var(--bad)}
.play.warn{background:var(--warn);border-color:var(--warn);color:#2A1A00}.play.info{background:transparent;border-color:var(--line2);color:var(--t1)}.play.info:hover{background:var(--s2)}
.play.big{height:50px;padding:0 32px;font:700 23px var(--disp);letter-spacing:.8px}

.art{position:relative;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--c,#4a5570) 80%,#000),#10141c);display:block}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.art .fb{position:absolute;inset:auto 10px 10px 10px;font:700 21px/1 var(--disp)}

.page{padding:24px 30px 40px;max-width:1720px;margin:auto}
.shelf{margin-top:30px}.shelfhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}.shelfhead h2{font-size:26px}.shelfhead span{color:var(--t3);font-size:13px}.shelfhead button{margin-left:auto;color:var(--t2);font-weight:700;font-size:12px}.shelfhead button:hover{color:var(--t1)}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:var(--w,170px);gap:14px;overflow-x:auto;padding:6px 3px 14px;scrollbar-width:thin}

.hero{position:relative;height:clamp(380px,58vh,600px);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none}.slide.on{opacity:1;pointer-events:auto}
.slide>.art{position:absolute;inset:0;background:#10141c}.slide.on>.art img{animation:kb 9s ease-out both}@keyframes kb{from{transform:scale(1.07)}to{transform:scale(1)}}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,11,15,.93) 4%,rgba(9,11,15,.35) 48%,transparent 72%),linear-gradient(0deg,var(--bg),transparent 42%)}
.herotext{position:absolute;z-index:2;left:42px;bottom:44px;width:min(520px,48%)}
.herotext .logo{max-width:370px;max-height:140px;display:block;margin-bottom:14px;filter:drop-shadow(0 4px 18px #000a)}.herotext h1{font-size:58px;line-height:1;margin-bottom:12px}
.kicker{display:inline-flex;gap:7px;align-items:center;font-weight:800;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--go);margin-bottom:10px}
.herotext p{color:#D5D9E1;margin:0 0 18px;font-size:15px;max-width:480px}.meta{display:flex;gap:16px;color:var(--t2);margin-bottom:18px;font-size:13px;flex-wrap:wrap}.meta b{color:var(--t1)}.herobtns{display:flex;gap:10px;align-items:center}
.thumbs{position:absolute;z-index:3;right:26px;bottom:44px;width:238px;display:flex;flex-direction:column;gap:7px}
.thumb{display:flex;gap:10px;align-items:center;padding:7px;border-radius:10px;background:rgba(9,11,15,.55);backdrop-filter:blur(12px);text-align:left;position:relative;overflow:hidden;border:1px solid transparent}
.thumb:hover{background:rgba(35,40,52,.8)}.thumb.on{background:rgba(35,40,52,.9);border-color:var(--line2)}
.thumb .art{width:42px;height:56px;border-radius:5px;flex:none}.thumb b{display:block;font-weight:700;line-height:1.2}.thumb small{color:var(--t2)}
.thumb u{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--go)}.thumb.on u{animation:grow 8s linear both}@keyframes grow{to{width:100%}}

.capsule{position:relative;cursor:pointer;min-width:0;transition:transform .18s}
.capsule .art{aspect-ratio:2/3;border-radius:9px;box-shadow:0 6px 18px #0007,0 0 0 1px var(--line)}
.capsule:hover,.capsule:focus-visible{transform:translateY(-5px) scale(1.02);z-index:2}.capsule:hover .art{box-shadow:0 16px 34px #000b,0 0 0 2px var(--c,var(--amb))}
.capsule .hov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:10px;background:linear-gradient(0deg,rgba(5,6,9,.93),transparent 62%);opacity:0;transition:.16s;z-index:2}
.capsule:hover .hov,.capsule:focus-within .hov{opacity:1}.hov .btn{width:100%;height:33px;font-size:12px}.hov small{color:var(--t2);font-size:11.5px}
.ctitle{margin-top:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.csub{font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:7px;left:7px;z-index:3;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:rgba(5,6,9,.82);backdrop-filter:blur(5px)}
.badge.go{color:var(--go)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}.badge.info{color:var(--info)}
.fav{position:absolute;top:7px;right:7px;z-index:3;color:#FF7C96;font-size:14px;text-shadow:0 1px 4px #000}
.pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0009;z-index:3}.pbar i{display:block;height:100%;background:var(--go)}

.cont{position:relative;cursor:pointer;border-radius:11px;overflow:hidden;background:var(--s0);box-shadow:0 0 0 1px var(--line);transition:.18s}.cont:hover{transform:translateY(-4px);box-shadow:0 14px 28px #0009,0 0 0 2px var(--c)}
.cont .art{aspect-ratio:460/215}.cont .info{padding:10px 12px 12px}.cont b{font-size:14.5px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cont small{color:var(--t2)}
.cont .quick{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:3px;background:#4FA321;color:#fff;font-size:13px;opacity:0;transition:.15s;z-index:3}.cont:hover .quick{opacity:1}

.libgrid{height:100%;display:grid;grid-template-columns:270px minmax(0,1fr)}
.libside{border-right:1px solid var(--line);background:rgba(9,11,15,.5);overflow:auto;padding:12px 10px}
.side-h{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--t3);padding:12px 9px 5px}
.sideitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:6px 9px;border-radius:7px;color:var(--t2);text-align:left;font-weight:600}
.sideitem:hover{background:var(--s1);color:var(--t1)}.sideitem.on{background:var(--s2);color:var(--t1)}.sideitem span{color:var(--t3);font-size:12px}
.minigame{display:flex;align-items:center;gap:9px;width:100%;padding:4px 7px;border-radius:6px;text-align:left;color:var(--t2)}.minigame:hover{background:var(--s2);color:var(--t1)}
.minigame .art{width:36px;height:18px;border-radius:3px;flex:none}.minigame span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.libmain{overflow:auto;padding:0 24px 30px}
.tools{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:13px 0;background:linear-gradient(180deg,var(--bg) 78%,transparent);flex-wrap:wrap}
.tools h1{font-size:30px;margin-right:6px}.tools h1 small{font:600 13px var(--ui);color:var(--t3);margin-left:7px}
.select{height:34px;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:0 8px;color:var(--t1)}.select option{background:#151922}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:2px}.seg button{height:28px;padding:0 10px;border-radius:6px;color:var(--t2);font-weight:700;font-size:12px}.seg button.on{background:var(--s3);color:var(--t1)}
.spacer{flex:1}.sizer{display:flex;align-items:center;gap:7px;color:var(--t3);font-size:12px}input[type=range]{accent-color:var(--amb);width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card),1fr));gap:18px 15px;padding:4px 3px}
.grouph{display:flex;gap:9px;align-items:baseline;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}.grouph h2{font-size:21px}.grouph span{color:var(--t3);font-size:12px}
.tbl{width:100%;border-collapse:collapse}.tbl th{position:sticky;top:60px;background:var(--bg);z-index:2;text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--t3);padding:7px 9px;border-bottom:1px solid var(--line);font-weight:800}
.tbl td{padding:6px 9px;border-bottom:1px solid var(--line);color:var(--t2)}.tbl tr{cursor:pointer}.tbl tbody tr:hover{background:var(--s1)}.tbl td b{color:var(--t1);font-weight:700}.tbl .art{width:92px;height:43px;border-radius:4px}

.ghero{position:relative;height:clamp(300px,46vh,470px);overflow:hidden}.ghero .art{position:absolute;inset:0}
.ghero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 1%,transparent 52%),linear-gradient(90deg,rgba(9,11,15,.5),transparent 55%)}
.ghero .logo{position:absolute;z-index:2;left:36px;bottom:26px;max-width:420px;max-height:170px;filter:drop-shadow(0 4px 20px #000b)}.ghero h1{position:absolute;z-index:2;left:36px;bottom:26px;font-size:64px;line-height:1}
.actionbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:26px;padding:12px 36px;background:rgba(14,17,23,.88);backdrop-filter:blur(16px);border-block:1px solid var(--line);flex-wrap:wrap}
.stat small{display:block;font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.6px}.stat b{font-size:15px;font-weight:700}
.actionbar .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.gtabs{display:flex;gap:4px;padding:0 36px;border-bottom:1px solid var(--line)}.gtabs button{padding:12px 13px;color:var(--t2);font:600 18px var(--disp);position:relative}.gtabs button:hover{color:var(--t1)}.gtabs button.on{color:var(--t1)}.gtabs button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--c,var(--amb))}
.gbody{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;padding:22px 36px 44px;max-width:1500px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:16px}.panel h3{font-size:20px;margin-bottom:9px}
.panel p{margin:0;color:var(--t2);font-size:14px;line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--t3);border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv b{color:var(--t1);font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;margin:0 5px 5px 0;background:var(--s2);border-radius:99px;font-size:12px;color:var(--t2);font-weight:600}
.sessions{display:flex;align-items:flex-end;gap:3px;height:88px}.sessions i{flex:1;background:var(--c,var(--amb));border-radius:2px 2px 0 0;min-height:2px;opacity:.85}.sessions i:hover{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 11px;border-radius:7px;background:var(--s2);color:var(--t2);font-weight:700;font-size:12px}.chip:hover{background:var(--s3)}.chip.on{background:var(--c,var(--amb));color:#08101a}
.stars button{color:var(--t3);font-size:19px}.stars button.on{color:#FFC94D}
.path{font:12.5px Consolas,monospace;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:7px;color:var(--t2);word-break:break-all}
.switch{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);color:var(--t2);width:100%;text-align:left}.switch i{width:36px;height:20px;border-radius:20px;background:var(--s3);position:relative;transition:.15s;flex:none}.switch i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.15s}.switch.on i{background:var(--go)}.switch.on i::after{left:19px}
.field{width:100%;height:36px;padding:0 10px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:7px}
.savet{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}.savet:last-child{border:0}.savet i{width:9px;height:9px;border-radius:50%;background:var(--go);flex:none}.savet div{flex:1}.savet small{display:block;color:var(--t3)}

.dlwrap{padding:20px 28px 40px;max-width:1500px;margin:auto}
.net{display:grid;grid-template-columns:minmax(0,1fr) 248px;gap:0;border:1px solid var(--line);border-radius:13px;background:var(--s1);overflow:hidden}.net canvas{width:100%;height:150px;display:block}
.nethead{display:flex;gap:15px;align-items:center;padding:11px 14px 0;font-size:12px;color:var(--t2)}.nethead b{font:700 25px var(--disp);color:var(--t1)}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.netside{border-left:1px solid var(--line);padding:11px 14px}.netside .kv{padding:6px 0}
.active{position:relative;display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;margin-top:16px;padding:14px;border:1px solid var(--line2);border-radius:13px;overflow:hidden;background:var(--s0)}
.active>.glow{position:absolute;inset:0;opacity:.17;background-size:cover;background-position:center;filter:blur(18px)}.active>*:not(.glow){position:relative}
.active .art{aspect-ratio:460/215;border-radius:8px}.activehead{display:flex;align-items:center;gap:8px}.activehead h2{font-size:29px;margin-right:auto}
.bigbar{height:9px;background:var(--s2);border-radius:9px;overflow:hidden;margin:9px 0 7px}.bigbar i{display:block;height:100%;background:var(--go);transition:width .9s linear}
.steps{display:flex;margin-top:10px;font-size:12px;font-weight:700;color:var(--t3)}.steps span{flex:1;padding-top:6px;border-top:3px solid var(--s2)}.steps span.done{border-color:var(--go);color:var(--t2)}.steps span.now{border-color:var(--amb);color:var(--t1)}
.dlsub{display:flex;gap:18px;color:var(--t2);font-size:13px;flex-wrap:wrap}.dlsub b{color:var(--t1)}
.qitem{display:grid;grid-template-columns:18px 104px minmax(0,1.2fr) minmax(90px,1fr) 104px 112px;gap:12px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line);cursor:pointer}.qitem:hover{background:var(--s1)}.qitem.open{background:var(--s2)}.qitem.over{box-shadow:inset 0 2px var(--amb)}
.qitem .art{height:48px;border-radius:5px}.qitem b{display:block;font-weight:700}.qitem small{color:var(--t3)}.grip{color:var(--t3);cursor:grab}
.tinybar{height:6px;background:var(--s2);border-radius:6px;overflow:hidden}.tinybar i{display:block;height:100%;background:var(--amb)}

function drawGraph(){
  const c=$('#graph');if(!c)return;
  const w=c.clientWidth,h=c.clientHeight,r=devicePixelRatio||1;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);
  const pts=S.graph,max=Math.max(30,...pts.map(p=>p[0]))*1.15,X=i=>i/(pts.length-1)*w,Y=v=>h-v/max*(h-6);
  x.strokeStyle='rgba(255,255,255,.06)';for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
  const line=(k,col,fill)=>{x.beginPath();pts.forEach((p,i)=>i?x.lineTo(X(i),Y(p[k])):x.moveTo(0,Y(p[k])));x.strokeStyle=col;x.lineWidth=2;x.stroke();if(fill){x.lineTo(w,h);x.lineTo(0,h);x.closePath();const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,fill);g.addColorStop(1,'transparent');x.fillStyle=g;x.fill()}};

}

    if(a==='verify')toast('Checking files against the torrent');
    if(a==='folder')toast('Opens the game folder in the real app');
    if(a==='move')toast('Opens the drive picker in the real app');
    if(a==='restore')toast('Save restored');
    if(a==='uninstall')toast('Asks for confirmation in the real app');
    if(a==='cancel'){const g=game(id);D=D.filter(d=>d.id!==g.id);g.st='Queued';D.push({id:g.id,p:0,stage:'Queued',down:0,up:0,peers:0,seeds:0,paused:false});toast('Moved '+g.n+' back to the queue');render(false);dlPill()}
    if(a==='fakefile')toast('Opens a file picker in the real app');
    if(a==='addgo'){
      if(S.addTab!=='Magnet'){closeAll();return}
      const v=$('#mag').value.trim();
      if(!/^magnet:\?/i.test(v)){$('#err').textContent='Paste a link that starts with magnet:?';return}
      const dn=new URLSearchParams(v.slice(v.indexOf('?')+1)).get('dn')||'New game',id=Date.now();
      G.unshift({id,n:dn,dev:'Unknown',y:2026,g:['Untagged'],pl:'Unknown',h:0,l:'Never',lt:99,z:20,st:'Downloading',c:'#5A6478',prog:'Backlog',r:0,art:false,d:'GaLa will fill this in after it matches the game.'});
      D.unshift({id,p:0,stage:'Download',down:14,up:.3,peers:9,seeds:5,paused:false});closeAll();toast('Added to downloads');go('downloads');
    }
    return;
  }
  if(x=c('[data-q]')){if(c('button,select'))return;S.dlopen=S.dlopen==x.dataset.q?null:+x.dataset.q;render(false);return}
  if(x=c('[data-go]')){closeAll();go(x.dataset.go)}
});
document.addEventListener('change',e=>{const k=e.target.dataset.lib;if(k){S.lib[k]=e.target.value;render(false)}});
document.addEventListener('input',e=>{
  if(e.target.id==='pinput'){palIdx=0;results()}
  if(e.target.id==='catsearch'){S.cat.q=e.target.value;$('#catresults').innerHTML=catCards()}
  if(e.target.id==='srcurl')$('#srcerr').textContent='';
  if(e.target.dataset?.lib==='size'){S.lib.size=+e.target.value;$('.libmain').style.setProperty('--card',S.lib.size+'px')}
  if(e.target.id==='mag')$('#err').textContent='';
});
document.addEventListener('contextmenu',e=>{const x=e.target.closest('[data-gid]');if(x){e.preventDefault();ctx(e,x.dataset.gid)}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if($('#couch').classList.contains('open')){
    const l=couchList();
    if(e.key==='ArrowRight')cIdx=Math.min(l.length-1,cIdx+1);if(e.key==='ArrowLeft')cIdx=Math.max(0,cIdx-1);
    if(e.key==='Enter'){play(l[cIdx].id);return}
    if(e.key==='Escape'){closeCouch();return}
    couch();return;
  }
  if(e.key==='Escape')closeAll();
  if($('#paletteOv').classList.contains('open')){
    if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palItems.length-1,palIdx+1);results()}
    if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(0,palIdx-1);results()}
    if(e.key==='Enter'&&palItems[palIdx]){const f=palItems[palIdx].fn;closeAll();f()}
    return;
  }
  if(e.key==='Enter'&&e.target.matches?.('[data-go]:not(button)'))go(e.target.dataset.go);
});
let dragId=null;
document.addEventListener('dragstart',e=>{const q=e.target.closest?.('[data-q]');if(q)dragId=+q.dataset.q});
document.addEventListener('dragover',e=>{const q=e.target.closest?.('[data-q]');if(q&&dragId){e.preventDefault();$$('.qitem').forEach(i=>i.classList.toggle('over',i===q))}});
document.addEventListener('drop',e=>{const q=e.target.closest?.('[data-q]');if(!q||!dragId)return;e.preventDefault();const a=D.find(d=>d.id===dragId);D=D.filter(d=>d!==a);const i=D.findIndex(d=>d.id==q.dataset.q);D.splice(i<0?D.length:i,0,a);dragId=null;render(false)});

setInterval(()=>{
  let rerender=false;
  const dl=D.find(d=>d.stage==='Download'&&!d.paused);
  for(const d of D){
    if(d.paused)continue;
    const i=STAGES.indexOf(d.stage);
    if(d.stage==='Download'){d.p=Math.min(100,d.p+.12);d.down=Math.max(8,Math.min(38,d.down+(Math.random()-.5)*3));d.up=Math.max(.6,d.up+(Math.random()-.5)*.3)}
    else if(i>0&&i<5)d.p=Math.min(100,d.p+1.2);
    else continue;
    if(d.p>=100){
      const g=game(d.id);
      if(d.stage==='Detect'){d.stage='Seeding';d.p=100;d.ratio=.1;d.up=.8;g.st='Seeding';toast(g.n+' is ready to play');}
      else{d.stage=STAGES[i+1];d.p=0;d.down=0;g.st=stateName[d.stage]}
      rerender=true;
    }
  }
  if(!D.some(d=>d.stage==='Download')){const q=D.find(d=>d.stage==='Queued');if(q){q.stage='Download';q.down=16;q.up=.5;q.peers=31;q.seeds=18;game(q.id).st='Downloading';rerender=true}}
  const net=D.reduce((x,d)=>x+d.down,0),up=D.reduce((x,d)=>x+d.up,0);
  S.graph.push([net,up]);S.graph.shift();
  dlPill();
  if(S.view==='downloads'){
    drawGraph();
    if(rerender)render(false);else{
      const a=D.find(d=>d.stage==='Download')||D.find(d=>['Verify','Extract','Install','Detect'].includes(d.stage));
      if(a&&$('[data-live=pct]')){const g=game(a.id);$('[data-live=pct]').textContent=Math.floor(a.p)+'%';$('[data-live=done]').textContent=(g.z*a.p/100).toFixed(1);$('[data-live=speed]').textContent=a.down.toFixed(1);$('[data-live=eta]').textContent=fmtEta(a);$('[data-live=bar]').style.width=a.p+'%'}
    }
  }
  if(S.run){const s=Math.floor((Date.now()-S.run.t)/1000),e=$('#elapsed');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
},1000);
setInterval(()=>{if(S.view==='home'&&!$('#hero:hover')&&!document.hidden)setHero((S.hero+1)%4)},8000);
addEventListener('resize',()=>{drawGraph();drawPieces()});
render();dlPill();
</script>
</body>
</html>
